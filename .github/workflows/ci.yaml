name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    tests:
        name: PHP ${{ matrix.php }}
        runs-on: ubuntu-latest

        strategy:
            fail-fast: false
            matrix:
                php: ['8.2', '8.3', '8.4', '8.5']

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: gd, intl, mbstring
                  coverage: none
                  tools: composer:v2

            - name: Install dependencies
              uses: ramsey/composer-install@v3

            - name: Validate composer.json
              run: composer validate --strict

            - name: Run the tests
              run: vendor/bin/phpunit

            # Static analysis and coding standards do not depend on the PHP version: run them once.
            - name: Check the coding standards
              if: matrix.php == '8.5'
              run: vendor/bin/php-cs-fixer fix --dry-run --diff

            - name: Run PHPStan
              if: matrix.php == '8.5'
              run: vendor/bin/phpstan analyse --no-progress
